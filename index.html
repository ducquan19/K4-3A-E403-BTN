<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP2 Mock — VLearn Grounded Tutor · Nhóm BTN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#eef1f6; --panel:#ffffff; --ink:#0f1830; --ink-soft:#4a5573;
    --header-bg:#111c3a; --header-ink:#fff; --orange:#e8762c;
    --green:#1f8a4c; --green-bg:#e7f6ec; --green-line:#8fd1a8;
    --blue:#1f5fd0; --blue-bg:#eaf1fd; --blue-line:#9dbdf0;
    --red:#c8342b; --red-bg:#fdecea; --red-line:#f0a89f;
    --track:#dfe3ee; --shadow:0 2px 10px rgba(15,24,48,.08);
    --bubble-user:#111c3a; --bubble-user-ink:#fff;
    --bubble-ai:#f3f4f8; --bubble-ai-ink:#0f1830;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){ --page-bg:#0b0f1a; }
  }
  :root[data-theme="dark"]{ --page-bg:#0b0f1a; }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--page-bg); color:var(--ink);
    font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px 14px 40px;
  }
  .wrap{max-width:900px;margin:0 auto}

  header{
    background:var(--header-bg); color:var(--header-ink);
    border-radius:14px; padding:20px 24px 24px; margin-bottom:18px;
  }
  .kicker{
    display:inline-block; background:var(--orange); color:#fff;
    font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px; margin-bottom:10px;
  }
  h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);font-weight:800;letter-spacing:-.01em}
  .sub{margin:6px 0 0;opacity:.9;font-size:.98rem;line-height:1.4}

  /* progress bar */
  .steps{display:flex;gap:8px;margin:0 0 18px}
  .step{
    flex:1; text-align:center; padding:9px 4px; border-radius:9px;
    font-size:.78rem; font-weight:700; color:var(--ink-soft);
    background:var(--panel); border:2px solid var(--track); transition:.15s;
  }
  .step.active{border-color:var(--orange); color:var(--orange); background:#fff5ec}
  .step.done{border-color:var(--green-line); color:var(--green); background:var(--green-bg)}

  .panel{
    background:var(--panel); border-radius:14px; padding:22px;
    box-shadow:var(--shadow); min-height:300px;
  }
  .panel h2{margin:0 0 4px;font-size:1.15rem;font-weight:800}
  .panel .desc{color:var(--ink-soft);font-size:.92rem;margin:0 0 18px;line-height:1.45}

  /* screen 1: pick question */
  .qlist{display:flex;flex-direction:column;gap:10px}
  .qcard{
    text-align:left; border:2px solid var(--track); background:#fff;
    border-radius:11px; padding:14px 16px; cursor:pointer; transition:.12s;
    font-family:inherit; font-size:.95rem; color:var(--ink);
  }
  .qcard:hover{border-color:var(--orange); transform:translateY(-1px)}
  .qcard .tagrow{display:flex;gap:8px;margin-bottom:6px}
  .qcard .badge{
    font-size:.68rem;font-weight:700;letter-spacing:.04em;
    padding:2px 9px;border-radius:5px;color:#fff;
  }
  .b-g{background:var(--green)} .b-c{background:var(--blue)} .b-o{background:var(--red)}
  .qcard .qtext{font-weight:600;color:var(--ink)}
  .qcard .qctx{font-size:.82rem;color:var(--ink-soft);margin-top:3px}

  /* screen 2: thinking */
  .thinking{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 10px;gap:14px}
  .dots{display:flex;gap:7px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);animation:bounce 1.1s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.15s}
  .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
  .thinking-label{font-size:.9rem;color:var(--ink-soft);font-weight:600}
  .thinking-sub{font-size:.8rem;color:var(--ink-soft);max-width:340px;text-align:center;line-height:1.5}

  /* screen 3: chat result */
  .chat{display:flex;flex-direction:column;gap:14px}
  .bubble-row{display:flex}
  .bubble-row.user{justify-content:flex-end}
  .bubble{
    max-width:78%; padding:12px 15px; border-radius:14px; font-size:.94rem; line-height:1.5;
  }
  .bubble.user{background:var(--bubble-user);color:var(--bubble-user-ink);border-bottom-right-radius:4px}
  .bubble.ai{background:var(--bubble-ai);color:var(--bubble-ai-ink);border-bottom-left-radius:4px}

  .result-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.72rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 11px; border-radius:999px; margin-bottom:9px;
  }
  .result-tag.g{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-line)}
  .result-tag.c{background:var(--blue-bg);color:var(--blue);border:1.5px solid var(--blue-line)}
  .result-tag.o{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-line)}

  .cite{
    margin-top:10px; font-size:.8rem; color:var(--ink-soft);
    background:#fff; border:1px dashed var(--track); border-radius:8px; padding:8px 11px;
  }
  .cite b{color:var(--ink)}

  .actions{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
  .btn{
    font-family:inherit; font-weight:700; font-size:.9rem; border-radius:9px;
    padding:11px 18px; border:2px solid var(--track); background:#fff; cursor:pointer; color:var(--ink);
  }
  .btn.primary{background:var(--header-bg);border-color:var(--header-bg);color:#fff}
  .btn:hover{opacity:.88}
  .btn[disabled]{opacity:.4;cursor:default}

  .flow-note{
    margin-top:18px; padding:12px 15px; border-radius:9px;
    background:#fdefe2; font-size:.85rem; color:var(--ink-soft); line-height:1.5;
    display:flex; gap:9px;
  }
  .flow-note .i{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--orange);color:#fff;
    font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
  }

  footer{text-align:center;margin-top:16px;font-size:.85rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">Checkpoint 2 · Mock bấm được</span>
    <h1>VLearn Grounded Tutor</h1>
    <p class="sub">Nhóm BTN — luồng học viên hỏi bài, tutor phân loại và trả lời có căn cứ. (Câu trả lời mẫu, chưa gọi AI thật)</p>
  </header>

  <div class="steps">
    <div class="step" id="s1">1 · Chọn câu hỏi</div>
    <div class="step" id="s2">2 · Tutor xử lý</div>
    <div class="step" id="s3">3 · Nhận kết quả</div>
  </div>

  <div class="panel" id="panel"></div>

  <footer>Bấm một câu hỏi mẫu để đi hết luồng · Nhóm BTN · VLearn Grounded Tutor</footer>
</div>

<script>
const scenarios = [
  {
    id:'grounded',
    label:'grounded',
    badgeClass:'b-g',
    q:'Overfitting với underfitting khác nhau chỗ nào ạ?',
    ctx:'Đang mở slide "Đánh giá mô hình học máy" — khái niệm có trong tài liệu',
    thinkingSub:'Tìm thấy đoạn khớp rõ trong slide đang mở → trả lời kèm trích dẫn',
    resultTag:'GROUNDED',
    resultClass:'g',
    answer:'Overfitting là khi mô hình học quá sát dữ liệu huấn luyện (kể cả nhiễu) nên dự đoán kém trên dữ liệu mới, còn underfitting là khi mô hình quá đơn giản, chưa học đủ mẫu hình nên sai cả trên tập huấn luyện lẫn tập kiểm tra.',
    cite:'Trích: Slide "Đánh giá mô hình học máy" · mục 2.1'
  },
  {
    id:'clarify',
    label:'clarify',
    badgeClass:'b-c',
    q:'Bài tập này nộp ở đâu vậy ạ?',
    ctx:'Câu hỏi mơ hồ — không rõ "bài tập" là bài nào, môn AI nào',
    thinkingSub:'Không đủ ngữ cảnh để xác định chắc chắn → hỏi lại thay vì đoán mò',
    resultTag:'CLARIFY',
    resultClass:'c',
    answer:'Mình chưa rõ bạn đang hỏi bài tập của module nào trong khoá AI — bạn có thể cho mình biết tên bài học hoặc mã buổi (ví dụ M03 - Học có giám sát) đang mở không? Mình sẽ tìm đúng hướng dẫn nộp bài cho bạn.',
    cite:'Không trích dẫn — cần thêm thông tin từ học viên trước khi trả lời'
  },
  {
    id:'oob',
    label:'out_of_bounds',
    badgeClass:'b-o',
    q:'Thầy cho em công thức lan truyền ngược (backpropagation) chi tiết với, phần này ngoài chương trình',
    ctx:'Bôi đen ngoài slide đang mở — khái niệm không có trong tài liệu khoá',
    thinkingSub:'Không tìm thấy đoạn khớp nào trong tài liệu đang mở → từ chối, chỉ nguồn khác',
    resultTag:'OUT_OF_BOUNDS',
    resultClass:'o',
    answer:'Nội dung này nằm ngoài phạm vi tài liệu của khoá AI đang mở, nên mình không tự giải thích để tránh sai sót. Bạn có thể hỏi giảng viên hoặc tra thêm ở giáo trình nâng cao để chắc chắn nhé.',
    cite:'Không có đoạn tài liệu nào khớp — từ chối theo ranh giới OUT_OF_BOUNDS'
  }
];

let current = null;
let stage = 1; // 1=pick, 2=thinking, 3=result

function setSteps(){
  for(let i=1;i<=3;i++){
    const el = document.getElementById('s'+i);
    el.classList.remove('active','done');
    if(i < stage) el.classList.add('done');
    else if(i === stage) el.classList.add('active');
  }
}

function renderPick(){
  stage = 1; current = null; setSteps();
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <h2>Học viên đang hỏi bài</h2>
    <p class="desc">Chọn một câu hỏi mẫu — như thể học viên vừa gõ vào ô chat của VLearn tutor.</p>
    <div class="qlist">
      ${scenarios.map(s => `
        <button class="qcard" data-id="${s.id}">
          <div class="tagrow"><span class="badge ${s.badgeClass}">${s.label}</span></div>
          <div class="qtext">“${s.q}”</div>
          <div class="qctx">${s.ctx}</div>
        </button>
      `).join('')}
    </div>
    <div class="flow-note"><span class="i">i</span><span>Đây là mock luồng cho CP2 — tutor chưa gọi AI thật, chỉ minh hoạ tutor sẽ đi qua bước nào và kết thúc ở đâu.</span></div>
  `;
  panel.querySelectorAll('.qcard').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      current = scenarios.find(s=>s.id===btn.dataset.id);
      renderThinking();
    });
  });
}

function renderThinking(){
  stage = 2; setSteps();
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <h2>Tutor đang xử lý</h2>
    <p class="desc">Kiểm tra tài liệu đang mở, đánh giá mức độ khớp, chọn nhánh phù hợp.</p>
    <div class="thinking">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="thinking-label">Đang tìm căn cứ trong tài liệu…</div>
      <div class="thinking-sub">${current.thinkingSub}</div>
    </div>
  `;
  setTimeout(renderResult, 1100);
}

function renderResult(){
  stage = 3; setSteps();
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <h2>Kết quả trả về cho học viên</h2>
    <p class="desc">Học viên thấy hội thoại như sau:</p>
    <div class="chat">
      <div class="bubble-row user"><div class="bubble user">${current.q}</div></div>
      <div class="bubble-row">
        <div class="bubble ai">
          <span class="result-tag ${current.resultClass}">${current.resultTag}</span>
          <div>${current.answer}</div>
          <div class="cite"><b>Căn cứ:</b> ${current.cite}</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="backBtn">← Thử câu hỏi khác</button>
      <button class="btn primary" id="restartBtn">Bắt đầu lại luồng</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderPick);
  document.getElementById('restartBtn').addEventListener('click', renderPick);
}

renderPick();
</script>
</body>
</html>
